<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça aos Casais 💛</title>
<style>
  :root {
    --bg: #1a1f2b;
    --card: #232a3a;
    --accent: #ffd166;
    --text: #f4f6fb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  header { text-align: center; margin-bottom: 12px; }
  header h1 { font-size: clamp(1.4rem, 4vw, 2.2rem); color: var(--accent); }
  header p { opacity: .8; font-size: clamp(.85rem, 2.5vw, 1rem); margin-top: 4px; }

  .placar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 10px 0 14px;
  }
  .slot {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--card);
    border: 2px dashed #4a5570;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    overflow: hidden;
    transition: transform .3s, border-color .3s;
  }
  .slot.achou {
    border: 2px solid var(--accent);
    transform: scale(1.08);
  }
  .slot img { width: 100%; height: 100%; object-fit: cover; }
  .contador { text-align: center; font-size: .95rem; opacity: .85; margin-bottom: 10px; }

  .cena-wrap {
    width: min(1100px, 100%);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    position: relative;
  }
  svg#cena { display: block; width: 100%; height: auto; }

  /* hotspots: invisíveis de propósito — nada de cursor pointer pra não entregar */
  .hotspot { fill: transparent; stroke: none; }
  .hotspot-grupo { cursor: default; }

  /* ondulação no clique */
  .ripple {
    position: absolute;
    border: 2px solid rgba(255,255,255,.7);
    border-radius: 50%;
    pointer-events: none;
    animation: ripple .6s ease-out forwards;
  }
  @keyframes ripple {
    from { opacity: .9; transform: translate(-50%,-50%) scale(.2); width: 40px; height: 40px; }
    to   { opacity: 0;  transform: translate(-50%,-50%) scale(1.6); width: 40px; height: 40px; }
  }

  /* modal de revelação */
  .modal {
    position: fixed; inset: 0;
    background: rgba(10,12,18,.82);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal.aberto { display: flex; }
  .cartao {
    background: var(--card);
    border-radius: 20px;
    padding: 22px;
    text-align: center;
    max-width: 340px;
    width: 100%;
    animation: pop .45s cubic-bezier(.2,1.6,.4,1);
    border: 2px solid var(--accent);
  }
  @keyframes pop {
    from { transform: scale(.5) rotate(-6deg); opacity: 0; }
    to   { transform: scale(1) rotate(0); opacity: 1; }
  }
  .cartao .moldura {
    width: 220px; height: 220px;
    margin: 0 auto 14px;
    border-radius: 16px;
    overflow: hidden;
    background: #313b52;
    display: flex; align-items: center; justify-content: center;
    border: 3px solid var(--accent);
  }
  .cartao .moldura img { width: 100%; height: 100%; object-fit: cover; }
  .cartao .sem-foto {
    font-size: 3.2rem;
    color: var(--accent);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .cartao .sem-foto small { font-size: .7rem; opacity: .7; color: var(--text); padding: 0 12px; }
  .cartao h2 { color: var(--accent); font-size: 1.5rem; }
  .cartao p.pista { opacity: .8; font-size: .9rem; margin-top: 4px; }
  .cartao button {
    margin-top: 16px;
    background: var(--accent);
    color: #1a1f2b;
    border: none;
    padding: 10px 26px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .cartao button:hover { filter: brightness(1.1); }

  /* animação da retroescavadeira (David) */
  #escavacao {
    position: fixed; inset: 0;
    background: rgba(10,12,18,.6);
    display: none;
    z-index: 60;
    overflow: hidden;
  }
  #escavacao.rodando { display: block; }
  #retro {
    position: absolute;
    bottom: 8vh;
    left: 0;
    width: min(320px, 55vw);
    animation: dirigir 1.6s ease-out forwards;
  }
  @keyframes dirigir {
    from { transform: translateX(110vw); }
    to   { transform: translateX(calc(50vw - 50%)); }
  }
  #retro .braco { transform-origin: 150px 95px; animation: cavar 1s ease-in-out 1.7s 1; }
  @keyframes cavar {
    0%   { transform: rotate(0deg); }
    45%  { transform: rotate(28deg); }
    100% { transform: rotate(0deg); }
  }

  .aviso-erro {
    position: absolute;
    background: rgba(0,0,0,.75);
    color: #fff;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: .8rem;
    pointer-events: none;
    transform: translate(-50%, -140%);
    animation: sumir 1.2s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes sumir {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -220%); }
  }

  /* confete final */
  .confete {
    position: fixed;
    top: -20px;
    width: 10px; height: 16px;
    z-index: 70;
    animation: cair linear forwards;
    pointer-events: none;
  }
  @keyframes cair {
    to { transform: translateY(110vh) rotate(720deg); }
  }
  .vitoria {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    z-index: 65;
    background: rgba(10,12,18,.85);
    padding: 20px;
  }
  .vitoria.aberto { display: flex; }
  .vitoria .cartao { max-width: 420px; }

  .acoes { margin-top: 14px; }
  .acoes button {
    background: transparent;
    border: 1px solid #4a5570;
    color: var(--text);
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: .85rem;
  }
  .acoes button:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>

    <h2 id="nomePessoa"></h2>
    <p class="pista" id="pistaPessoa"></p>
    <button id="btnFechar">Continuar 🔎</button>
  </div>
</div>

<!-- animação da retroescavadeira -->
<div id="escavacao">
  <svg id="retro" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
    <g>
      <rect x="30" y="90" width="130" height="55" rx="10" fill="#f3a712"/>
      <rect x="55" y="45" width="70" height="55" rx="8" fill="#f3c53d"/>
      <rect x="65" y="55" width="50" height="32" rx="5" fill="#bfe3f5"/>
      <circle cx="60" cy="158" r="26" fill="#2e3440"/>
      <circle cx="60" cy="158" r="13" fill="#7a828f"/>
      <circle cx="135" cy="158" r="26" fill="#2e3440"/>
      <circle cx="135" cy="158" r="13" fill="#7a828f"/>
      <g class="braco">
        <path d="M150 95 L225 60" stroke="#e08900" stroke-width="16" stroke-linecap="round"/>
        <path d="M225 60 L280 120" stroke="#e08900" stroke-width="14" stroke-linecap="round"/>
        <path d="M270 112 q28 4 22 32 q-24 6 -34 -12 Z" fill="#5a6270"/>
      </g>
    </g>
  </svg>
</div>

<!-- vitória -->
<div class="vitoria" id="vitoria">
  <div class="cartao">
    <h2>🎉 Encontraram todo mundo!</h2>
    <p class="pista" style="margin-top:10px">Os 4 casais estão completos. Parabéns, detetives! 💛</p>
    <button id="btnFecharVitoria">Ver a cena de novo</button>
  </div>
</div>

<script>
const PESSOAS = {
  yuri:        { nome: 'Yuri',         emoji: '📷', pista: 'Estava de olho em tudo pela câmera do poste!' },
  duda:        { nome: 'Duda',         emoji: '🌸', pista: 'Escondida na flor mais bonita do canteiro.' },
  alvaro:      { nome: 'Álvaro',       emoji: '😁', pista: 'Brilhando no sorriso dela!' },
  andressa:    { nome: 'Andressa',     emoji: '✈️', pista: 'Passando voando lá no céu.' },
  david:       { nome: 'David',        emoji: '🚜', pista: 'Foi preciso uma retroescavadeira pra desenterrar!' },
  bianca:      { nome: 'Bianca',       emoji: '📘', pista: 'Guardada entre as páginas do livro.' },
  sammya:      { nome: 'Sammya',       emoji: '🐦', pista: 'Cantando com o passarinho no galho da árvore.' },
  luisgustavo: { nome: 'Luís Gustavo', emoji: '👔', pista: 'Era ele o advogado o tempo todo!' },
};
const FOTO_EXTENSOES = ['jpg', 'jpeg', 'png', 'webp'];
const ORDEM = ['yuri', 'duda', 'alvaro', 'andressa', 'david', 'bianca', 'sammya', 'luisgustavo'];

let encontrados = new Set(JSON.parse(localStorage.getItem('cacaCasais') || '[]'));

const placar = document.getElementById('placar');
const contador = document.getElementById('contador');
const modal = document.getElementById('modal');
const moldura = document.getElementById('moldura');
const nomePessoa = document.getElementById('nomePessoa');
const pistaPessoa = document.getElementById('pistaPessoa');
const escavacao = document.getElementById('escavacao');
const vitoria = document.getElementById('vitoria');
const cenaWrap = document.getElementById('cenaWrap');

function montarFoto(id, alvo, tamanhoGrande) {
  alvo.innerHTML = '';
  const p = PESSOAS[id];
  const img = document.createElement('img');
  let i = 0;
  img.onerror = () => {
    i++;
    if (i < FOTO_EXTENSOES.length) {
      img.src = `fotos/${id}.${FOTO_EXTENSOES[i]}`;
    } else {
      alvo.innerHTML = tamanhoGrande
        ? `<div class="sem-foto">${p.emoji}<small>coloque a foto em fotos/${id}.jpg</small></div>`
        : p.emoji;
    }
  };
  img.src = `fotos/${id}.${FOTO_EXTENSOES[0]}`;
  img.alt = p.nome;
  alvo.appendChild(img);
}

function atualizarPlacar() {
  placar.innerHTML = '';
  for (const id of ORDEM) {
    const slot = document.createElement('div');
    slot.className = 'slot' + (encontrados.has(id) ? ' achou' : '');
    slot.title = encontrados.has(id) ? PESSOAS[id].nome : '???';
    if (encontrados.has(id)) {
      montarFoto(id, slot, false);
    } else {
      slot.textContent = '?';
    }
    placar.appendChild(slot);
  }
  contador.textContent = `${encontrados.size} de ${ORDEM.length} encontrados`;
  localStorage.setItem('cacaCasais', JSON.stringify([...encontrados]));
}

function revelar(id) {
  const p = PESSOAS[id];
  montarFoto(id, moldura, true);
  nomePessoa.textContent = `${p.emoji} ${p.nome}!`;
  pistaPessoa.textContent = p.pista;
  modal.classList.add('aberto');
  encontrados.add(id);
  atualizarPlacar();
}

function animarEscavacao(depois) {
  escavacao.classList.add('rodando');
  const retro = document.getElementById('retro');
  retro.style.animation = 'none';
  void retro.offsetWidth; // reinicia a animação
  retro.style.animation = '';
  setTimeout(() => {
    escavacao.classList.remove('rodando');
    depois();
  }, 3000);
}

function confetes() {
  const cores = ['#ffd166', '#e77fb3', '#7fd0ff', '#8ce99a', '#e8743e', '#c2497a'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('div');
    c.className = 'confete';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cores[Math.floor(Math.random() * cores.length)];
    c.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
    c.style.animationDelay = (Math.random() * 1.2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }
}

document.querySelectorAll('.hotspot').forEach(h => {
  h.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = h.dataset.pessoa;
    if (id === 'david' && !encontrados.has('david')) {
      animarEscavacao(() => revelar('david'));
    } else {
      revelar(id);
    }
  });
});

// clique errado: ondulação + mensagem
document.getElementById('cena').addEventListener('click', (e) => {
  const rect = cenaWrap.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = x + 'px';
  r.style.top = y + 'px';
  cenaWrap.appendChild(r);
  setTimeout(() => r.remove(), 700);

  if (Math.random() < 0.35) {
    const frases = ['Nada aqui... 👀', 'Frio! ❄️', 'Continua procurando!', 'Hmm, não é aqui 🤔'];
    const a = document.createElement('div');
    a.className = 'aviso-erro';
    a.textContent = frases[Math.floor(Math.random() * frases.length)];
    a.style.left = x + 'px';
    a.style.top = y + 'px';
    cenaWrap.appendChild(a);
    setTimeout(() => a.remove(), 1300);
  }
});

document.getElementById('btnFechar').addEventListener('click', () => {
  modal.classList.remove('aberto');
  if (encontrados.size === ORDEM.length) {
    vitoria.classList.add('aberto');
    confetes();
  }
});
document.getElementById('btnFecharVitoria').addEventListener('click', () => {
  vitoria.classList.remove('aberto');
});
document.getElementById('btnReiniciar').addEventListener('click', () => {
  encontrados = new Set();
  atualizarPlacar();
});

atualizarPlacar();
</script>
</body>
</html>
