<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Jogo dos 4 Casais</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  header { text-align: center; margin-bottom: 12px; }
  header h1 {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    background: linear-gradient(90deg, #ff6b9d, #ffd166, #6bd5ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: #aab; font-size: clamp(.8rem, 2.5vw, 1rem); margin-top: 4px; }

  .placar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin: 10px 0 14px;
    max-width: 900px;
  }
  .chip {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: .85rem;
    color: #99a;
    transition: all .4s;
  }
  .chip.achou {
    background: linear-gradient(90deg, #ff6b9d33, #ffd16633);
    border-color: #ffd166;
    color: #ffd166;
    font-weight: bold;
  }
  #contador { font-weight: bold; color: #fff; }

  .cena-wrap {
    width: 100%;
    max-width: 1100px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    line-height: 0;
  }
  svg#cena { width: 100%; height: auto; display: block; }

  .hotspot { cursor: default; }
  .hotspot.achado { pointer-events: none; }

  .marca-achado { pointer-events: none; }

  @keyframes ripple {
    from { r: 4; opacity: .9; }
    to   { r: 30; opacity: 0; }
  }
  .ripple { animation: ripple .6s ease-out forwards; }

  /* ---------- Modal ---------- */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(10,10,25,.85);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  #overlay.aberto { display: flex; }

  .card {
    background: linear-gradient(160deg, #232346, #1a1a35);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    max-width: 380px;
    width: 100%;
    animation: aparecer .35s ease-out;
    overflow: hidden;
  }
  @keyframes aparecer {
    from { transform: scale(.7); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  #palco-escavadeira { display: none; margin-bottom: -10px; }
  #palco-escavadeira.ativo { display: block; }
  @keyframes cavar {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(28deg); }
  }
  .braco-escavadeira {
    transform-origin: 84px 30px;
    animation: cavar 1s ease-in-out 2;
  }

  .foto-wrap {
    width: 220px; height: 220px;
    margin: 0 auto 16px;
    border-radius: 16px;
    overflow: hidden;
    border: 3px solid #ffd166;
    background: #111;
  }
  .foto-wrap.subindo { animation: subir 1s ease-out .9s backwards; }
  @keyframes subir {
    from { transform: translateY(260px); }
    to   { transform: translateY(0); }
  }
  .foto-wrap img { width: 100%; height: 100%; object-fit: cover; }

  .foto-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #ff6b9d, #6b5bff);
  }
  .foto-placeholder .letra { font-size: 4rem; font-weight: 800; }
  .foto-placeholder small { font-size: .7rem; opacity: .85; padding: 0 10px; }

  .card h2 { font-size: 1.6rem; color: #ffd166; }
  .card p.msg { color: #ccd; margin: 8px 0 18px; }
  .card button {
    background: linear-gradient(90deg, #ff6b9d, #ff9d6b);
    border: none; color: #fff;
    font-size: 1rem; font-weight: bold;
    padding: 10px 30px;
    border-radius: 25px;
    cursor: pointer;
  }
  .card button:hover { filter: brightness(1.1); }

  /* ---------- Tela final ---------- */
  #final .casais {
    display: flex; flex-direction: column; gap: 8px;
    margin: 14px 0 18px;
  }
  #final .casal {
    background: rgba(255,255,255,.07);
    border-radius: 12px;
    padding: 8px;
    font-size: 1.05rem;
  }
  #final .casal span { color: #ffd166; font-weight: bold; }
</style>
</head>

  advogado: { nome: 'Luís Gustavo', arquivo: 'luisgustavo', msg: 'O advogado misterioso era ele! ⚖️' },
  flor:     { nome: 'Duda',         arquivo: 'duda',        msg: 'Escondida na flor mais bonita do parque! 🌸' },
  livro:    { nome: 'Bianca',       arquivo: 'bianca',      msg: 'Marcando página no livro da moça! 📖' },
  aviao:    { nome: 'Andressa',     arquivo: 'andressa',    msg: 'Sobrevoando o parque de avião! ✈️' },
  dente:    { nome: 'Álvaro',       arquivo: 'alvaro',      msg: 'Escondido no sorriso da moça! 😁' },
  passaro:  { nome: 'Sammya',       arquivo: 'sammya',      msg: 'Cantando junto com o passarinho! 🐦' },
};
const EXTENSOES = ['jpg', 'jpeg', 'png', 'webp'];
const achados = new Set();

const svg = document.getElementById('cena');
const overlay = document.getElementById('overlay');
const overlayFinal = document.getElementById('overlay-final');
const placar = document.getElementById('placar');

// monta o placar
for (const chave of Object.keys(PONTOS)) {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.id = 'chip-' + chave;
  chip.textContent = '?????';
  placar.appendChild(chip);
}

// flores decorativas (não clicáveis)
const deco = document.getElementById('flores-deco');
const floresDeco = [
  [905, 705, '#ffd166'], [955, 738, '#f4f0e4'], [1065, 715, '#b28dff'],
  [1120, 690, '#ffd166'], [1150, 745, '#ff9d6b'], [355, 690, '#f4f0e4'],
  [400, 735, '#b28dff'], [640, 720, '#ffd166'], [710, 755, '#ff9d6b'],
];
for (const [x, y, cor] of floresDeco) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', `translate(${x},${y})`);
  let petalas = '';
  for (let a = 0; a < 360; a += 72) {
    petalas += `<ellipse cx="0" cy="-9" rx="4.5" ry="7" fill="${cor}" transform="rotate(${a} 0 0)"/>`;
  }
  g.innerHTML = `<line x1="0" y1="4" x2="0" y2="34" stroke="#3e7d2f" stroke-width="3"/>${petalas}<circle r="4" fill="#e0a600"/>`;
  deco.appendChild(g);
}

// cliques nos pontos escondidos
svg.addEventListener('click', (ev) => {
  const alvo = ev.target.closest('.hotspot');
  if (alvo && !achados.has(alvo.dataset.spot)) {
    encontrou(alvo);
  } else if (!alvo) {
    ondinha(ev);
  }
});

function encontrou(el) {
  const chave = el.dataset.spot;
  const p = PONTOS[chave];
  achados.add(chave);
  el.classList.add('achado');
  marcaAchado(el);

  const chip = document.getElementById('chip-' + chave);
  chip.textContent = '✓ ' + p.nome;
  chip.classList.add('achou');
  document.getElementById('contador').textContent = achados.size + '/8';

  // modal
  document.getElementById('nome-achado').textContent = p.nome;
  document.getElementById('msg-achado').textContent = p.msg;
  const palco = document.getElementById('palco-escavadeira');
  const wrap = document.getElementById('foto-wrap');
  palco.classList.toggle('ativo', !!p.escavadeira);
  wrap.classList.toggle('subindo', !!p.escavadeira);
  if (p.escavadeira) {
    const braco = palco.querySelector('.braco-escavadeira');
    braco.style.animation = 'none';
    void braco.offsetWidth;
    braco.style.animation = '';
  }
  carregarFoto(wrap, p);
  overlay.classList.add('aberto');
}

function carregarFoto(wrap, p) {
  wrap.innerHTML = '';
  const img = document.createElement('img');
  img.alt = p.nome;
  let i = 0;
  img.onerror = () => {
    i++;
    if (i < EXTENSOES.length) {
      img.src = `fotos/${p.arquivo}.${EXTENSOES[i]}`;
    } else {
      wrap.innerHTML = `<div class="foto-placeholder">
        <div class="letra">${p.nome[0]}</div>
        <small>adicione a foto em<br><b>fotos/${p.arquivo}.jpg</b></small>
      </div>`;
    }
  };
  img.src = `fotos/${p.arquivo}.${EXTENSOES[0]}`;
  wrap.appendChild(img);
}

function marcaAchado(el) {
  const bb = el.getBBox();
  const cx = bb.x + bb.width / 2;
  const cy = bb.y + bb.height / 2;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'marca-achado');
  g.innerHTML = `<circle cx="${cx}" cy="${cy}" r="13" fill="#ffd166" stroke="#fff" stroke-width="2.5"/>
    <path d="M ${cx - 6},${cy} l 4,5 l 8,-9" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  (el.closest('g') || svg).appendChild(g);
}

function ondinha(ev) {
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX;
  pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', p.x);
  c.setAttribute('cy', p.y);
  c.setAttribute('r', 4);
  c.setAttribute('fill', 'none');
  c.setAttribute('stroke', '#ffffff');
  c.setAttribute('stroke-width', 3);
  c.setAttribute('class', 'ripple');
  svg.appendChild(c);
  setTimeout(() => c.remove(), 650);
}

function fecharModal() {
  overlay.classList.remove('aberto');
  if (achados.size === Object.keys(PONTOS).length) {
    overlayFinal.style.display = 'flex';
  }
}

function reiniciar() {
  location.reload();
}

overlay.addEventListener('click', (ev) => {
  if (ev.target === overlay) fecharModal();
});
</script>
</body>
</html>
