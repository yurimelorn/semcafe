<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça ao Casal — Encontre Todo Mundo!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a2332;
    --card: #243044;
    --accent: #ffb84d;
    --text: #f0ead6;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  header { text-align: center; margin-bottom: 12px; }
  header h1 { font-size: clamp(1.4rem, 4vw, 2.2rem); color: var(--accent); }
  header p { opacity: .8; font-size: clamp(.85rem, 2.5vw, 1rem); margin-top: 4px; }

  /* Placar de encontrados */
  #placar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 14px;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 2px solid #3a4a63;
    border-radius: 999px;
    padding: 4px 12px 4px 6px;
    font-size: .8rem;
    opacity: .45;
    transition: all .4s ease;
  }
  .chip .dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #3a4a63;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .65rem;
    font-weight: bold;
    overflow: hidden;
  }
  .chip .dot img { width: 100%; height: 100%; object-fit: cover; }
  .chip.achou {
    opacity: 1;
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(255,184,77,.35);
  }
  .chip.achou .dot { background: var(--accent); color: #1a2332; }

  #contagem { font-weight: bold; color: var(--accent); }

  /* Cena */
  #palco {
    width: 100%;
    max-width: 960px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    position: relative;
  }
  #palco svg { display: block; width: 100%; height: auto; }

  .hotspot { cursor: pointer; }
  #retro, #foto-puxada { pointer-events: none; }
  .hotspot:hover { filter: brightness(1.15); }

  /* pulso de dica */
  @keyframes pulso {
    0%, 100% { opacity: 0; }
    50% { opacity: .55; }
  }
  .dica-anel {
    fill: none;
    stroke: #fff;
    stroke-width: 3;
    opacity: 0;
    pointer-events: none;
  }
  .mostrando-dicas .dica-anel { animation: pulso 1.6s ease-in-out infinite; }

  #botoes { margin-top: 14px; display: flex; gap: 10px; }
  button {
    background: var(--card);
    color: var(--text);
    border: 2px solid #3a4a63;
    border-radius: 10px;
    padding: 8px 18px;
    font-size: .9rem;
    cursor: pointer;
    transition: all .2s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }

  /* Modal de revelação */
  #veu {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 22, .82);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  #veu.aberto { display: flex; }

  @keyframes surgir {
    from { transform: scale(.5) rotate(-6deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  #cartao {
    background: var(--card);
    border: 3px solid var(--accent);
    border-radius: 20px;
    padding: 22px;
    text-align: center;
    max-width: 340px;
    width: 100%;
    animation: surgir .45s cubic-bezier(.34,1.56,.64,1);
  }
  #cartao .moldura {
    width: 220px; height: 220px;
    margin: 0 auto 14px;
    border-radius: 16px;
    background: #3a4a63;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 4px solid #fff2;
  }
  #cartao .moldura img { width: 100%; height: 100%; object-fit: cover; }
  #cartao .moldura .inicial {
    font-size: 4.5rem;
    font-weight: bold;
    color: var(--accent);
  }
  #cartao h2 { color: var(--accent); font-size: 1.5rem; }
  #cartao .achado-em { opacity: .75; font-size: .85rem; margin: 6px 0 14px; }
  #cartao .sem-foto { font-size: .7rem; opacity: .5; margin-bottom: 12px; }

  /* Confete final */
  #final {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 22, .9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 20px;
    text-align: center;
  }
  #final.aberto { display: flex; }
  #final .caixa {
    animation: surgir .5s cubic-bezier(.34,1.56,.64,1);
  }
  #final h2 { font-size: clamp(1.6rem, 6vw, 3rem); color: var(--accent); margin-bottom: 10px; }
  #final p { font-size: 1.1rem; margin-bottom: 20px; }

  @keyframes cair {
    to { transform: translateY(110vh) rotate(720deg); }
  }
  .confete {
    position: fixed;
    top: -20px;
    width: 12px; height: 12px;
    animation: cair linear forwards;
    z-index: 61;
    pointer-events: none;
  }
</style>
</head>

const achados = new Set();
const placar = document.getElementById('placar');

// ======= LÓGICA DO JOGO =======
function atualizarContagem() {
  document.getElementById('contagem').textContent = achados.size + '/8';
  if (achados.size === PESSOAS.length) {
    setTimeout(() => {
      document.getElementById('final').classList.add('aberto');
      soltarConfete();
    }, 600);
  }
}

function revelar(pessoa) {
  if (!achados.has(pessoa.id)) {
    achados.add(pessoa.id);
    const chip = document.getElementById('chip-' + pessoa.id);
    chip.classList.add('achou');
    // tenta colocar a foto no chip também
    const img = new Image();
    img.onload = () => { chip.querySelector('.dot').innerHTML = ''; chip.querySelector('.dot').appendChild(img); };
    img.src = pessoa.foto;
  }

  const moldura = document.getElementById('moldura');
  const aviso = document.getElementById('aviso-foto');
  moldura.innerHTML = `<span class="inicial">${pessoa.nome[0]}</span>`;
  aviso.style.display = 'block';
  document.getElementById('caminho-foto').textContent = pessoa.foto;

  const img = new Image();
  img.onload = () => { moldura.innerHTML = ''; moldura.appendChild(img); aviso.style.display = 'none'; };
  img.src = pessoa.foto;

  document.getElementById('nome-achado').textContent = pessoa.nome;
  document.getElementById('local-achado').textContent = pessoa.local;
  document.getElementById('veu').classList.add('aberto');
  atualizarContagem();
}

function fecharCartao() {
  document.getElementById('veu').classList.remove('aberto');
}
document.getElementById('veu').addEventListener('click', e => {
  if (e.target.id === 'veu') fecharCartao();
});

// liga os hotspots (David tem animação especial)
PESSOAS.forEach(p => {
  const el = document.getElementById('spot-' + p.id);
  if (!el) return;
  el.addEventListener('click', () => {
    if (p.id === 'david') animarRetro(p);
    else revelar(p);
  });
});

// ======= ANIMAÇÃO DA RETROESCAVADEIRA (David) =======
let animandoRetro = false;
function animarRetro(pessoa) {
  if (animandoRetro) return;
  if (achados.has('david')) { revelar(pessoa); return; }
  animandoRetro = true;

  const retro = document.getElementById('retro');
  const foto = document.getElementById('foto-puxada');
  retro.setAttribute('opacity', '1');

  // entra dirigindo da esquerda
  animate(1400, t => {
    const x = -220 + t * 220; // vai até x=0 (braço alcança a terra em ~x=160)
    retro.setAttribute('transform', `translate(${x},455)`);
  }, () => {
    // "cava": balança o braço
    let vezes = 0;
    const cavar = () => {
      animate(300, t => {
        const ang = Math.sin(t * Math.PI) * 14;
        document.getElementById('retro-braco').setAttribute('transform', `rotate(${ang} 78 24)`);
      }, () => {
        vezes++;
        if (vezes < 3) cavar();
        else {
          // foto sobe da terra
          foto.setAttribute('opacity', '1');
          animate(900, t => {
            const y = 520 - t * 110;
            const rot = Math.sin(t * Math.PI * 2) * 6;
            foto.setAttribute('transform', `translate(160,${y}) rotate(${rot})`);
          }, () => {
            setTimeout(() => {
              revelar(pessoa);
              // limpa a cena
              retro.setAttribute('opacity', '0');
              foto.setAttribute('opacity', '0');
              retro.setAttribute('transform', 'translate(-220,455)');
              foto.setAttribute('transform', 'translate(160,520)');
              animandoRetro = false;
            }, 500);
          });
        }
      });
    };
    cavar();
  });
}

function animate(dur, passo, fim) {
  const inicio = performance.now();
  function frame(agora) {
    const t = Math.min((agora - inicio) / dur, 1);
    passo(t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2); // easing
    if (t < 1) requestAnimationFrame(frame);
    else if (fim) fim();
  }
  requestAnimationFrame(frame);
}

// ======= DICAS =======
document.getElementById('btn-dica').addEventListener('click', () => {
  const cena = document.getElementById('cena');
  cena.classList.add('mostrando-dicas');
  setTimeout(() => cena.classList.remove('mostrando-dicas'), 3000);
});

// ======= REINICIAR =======
function reiniciar() {
  achados.clear();
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('achou'));
  PESSOAS.forEach(p => {
    const chip = document.getElementById('chip-' + p.id);
    chip.querySelector('.dot').innerHTML = p.nome[0];
  });
  document.getElementById('final').classList.remove('aberto');
  document.getElementById('contagem').textContent = '0/8';
}
document.getElementById('btn-reiniciar').addEventListener('click', reiniciar);

// ======= CONFETE =======
function soltarConfete() {
  const cores = ['#ffb84d', '#e8639a', '#6ab0e0', '#7cb95c', '#c88ae0', '#f2c14e'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confete';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cores[Math.floor(Math.random() * cores.length)];
    c.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    c.style.animationDelay = Math.random() * 1.5 + 's';
    c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }
}
